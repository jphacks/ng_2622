title = "画面設計書（to-be・モック）"
entry_notes = [
  "起動: アプリを開くとホームが出る（名前を保存していないときだけ、名前を決める最初の画面が先に出る）。ログインは無い。",
  "部屋: 「あそぶ」で誰でも自分の部屋を作ってホストになる。ほかの人の部屋へは、待合の「他のルーム」で部屋のコードか QR を入れて移る。共有の画面は持たず、全員が同じプレイヤー画面を使う。",
  "状態（2026-11-13）: 各画面に状態の札を付ける。実装済み（feat/eiken-switch に入っている）・確定（2026-11-13 のレビューで決めた。実装は PR にある）・案（直し待ち。今の実装と、Codex で作った直す案の画像を並べる）・未確定（案の画像のみ。これから grill）。遷移図では、確定を灰色の枠、案をオレンジの破線、未確定を灰色の点線で描く。v2 で決めてこの文書を main に入れてから、PR を入れる。 2026-11-13 のうちに、新しい画面はすべて確定にした（苦手は実装がまだ無い）。",
  "きろく・設定（2026-11-12。2026-11-13 に直す所を決めた）: 遊んだ記録（自分の結果・場面の配置・自分の録音）は端末の中だけに残す。ホームの「きろく」から場面ごとに見返し、回ごとの振り返りを縦の流れで読む。3D は上端で止めてずっと見せ、苦手の入口は下に固定したフッター（案 B 改に確定。止まった 3D と名前の下は帯で区切らず、中身をぼかしの壁に溶かす。余白は詰める。実装は #114 を直す）。設定は今は 名前と色（画面の中で変える）・すべて消す の 2 つ（確定。実装は #114・#116 で直す）。苦手（記録を数える分析と AI の分析）は、並びと中身、点の推移（合計の線と 3 つの軸の今の点と伸び）を決めた（確定。実装はこれから。入口は記録が 5 件以上のときだけ出る）。",
  "場面と難易度（2026-11-11）: 場面は AI で作り置いたもの（scenenglish.scene/2）だけで遊ぶ。ホストは待合で難易度だけを選ぶ（かんたん＝英検3級・ふつう＝準2級・むずかしい＝2級）。場面は名前も絵もスタートまで見せない。各場面に級の見本の答え（3〜6 文の英文）とチェックリスト（中心・理由・つながり・細部）がある。",
  "1 ラウンド: 3D シーンが自動で 1 周（約 3 秒、操作不可）→ 全員一斉に録音（最長 20 秒、「話し終えた」で止められる）→ 全員の採点がそろったら一斉に結果発表。そろわないときはサーバーが時間で締め切る（録音が終わるはずの時刻から、音声は 15 秒・採点は 30 秒まで待つ）。",
  "採点（2026-11-11）: 英検の二次試験の観点に沿わせた 3 つの軸。内容 50%（場面のチェックリストの F1。言えた＝言えた項目の重み ÷ 満点、正しさ＝正しい描写 ÷ 言った描写）、表現 25%（Claude）、話し方 25%（Azure の発音評価。文字起こしも Azure）。3 つの軸とチェックの中身は振り返りだけに出し、よく見る画面（録音・待機・結果発表・みんなの描写）には文字を足さない。",
