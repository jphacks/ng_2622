title = "画面設計書（to-be・モック）"
entry_notes = [
  "起動: アプリを開くとホームが出る。ログインは無い。初めて開いたときだけ、先に名前を決める画面が出る（2026-11-12 に決定、未実装）。",
  "部屋: 1 人が「部屋を作る」でホストになり、他の人は部屋のコードか QR で入る。共有の画面は持たず、全員が同じプレイヤー画面を使う。",
  "状態（2026-11-12）: 各画面に状態の札を付ける。実装済み（feat/eiken-switch に入っている）・実装中（作り終えて直している）・確定・未実装・合意待ち（grill を終え、ユーザーの最後の「はい」を待っている）・未確定（これから grill）。遷移図では、合意待ちをオレンジの破線、未確定を灰色の点線で描く。",
  "合意待ち（2026-11-12）: 「部屋を作る」「部屋に入る」をホームの「あそぶ」1 つにまとめ、他の人の部屋には待合の「他のルーム」（シート）から入る。",
  "きろく・設定（2026-11-12）: 遊んだ記録（自分の結果・場面の配置・自分の録音）は端末の中だけに残す。ホームの「きろく」から場面ごとに見返し、記録を押すと振り返りを開き直す（実装中）。設定（名前と色・すべて消す・プライバシーポリシー・問い合わせ・ライセンス・版）は確定・未実装。苦手（記録を数える分析と AI の分析）は未確定。",
