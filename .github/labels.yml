# issue / PR のラベル定義。scripts/setup-github-repo.sh が GitHub に同期する。
# 形式は - name / color / description のフラットな配列に限る（同期スクリプトが簡易パースするため）。
- name: "kind:feature"
  color: "a2eeef"
  description: "新機能・改善"
- name: "kind:bug"
  color: "d73a4a"
  description: "既存の挙動がおかしい"
- name: "kind:docs"
  color: "0075ca"
  description: "ドキュメント"
- name: "kind:tech-debt"
  color: "7057ff"
  description: "リファクタ・開発環境・内部品質"
- name: "priority:high"
  color: "d93f0b"
  description: "優先して対応する"
- name: "priority:low"
  color: "0e8a16"
  description: "後回しでよい"
