# コードの整形の検査。手元では lefthook の pre-commit で整形するので、ここは整形し忘れに気づくためのもの。
# ruleset の merge の条件には入れていない（必要になったら scripts/setup-github-repo.sh の REQUIRED_CHECK に足す）。
name: format-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # pnpm の版は package.json の packageManager に合わせる
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome で整形と lint を検査
        run: pnpm exec biome ci
