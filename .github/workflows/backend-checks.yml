# PR で backend/ の型チェック、openapi.json が最新か、ビルドを確かめる。壊れたものが main に入ってデプロイで落ちるのを防ぐ。
# backend を触らない PR では動かないので、ruleset の必須チェックには入れていない。
name: backend-checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # pnpm の版は backend/package.json の packageManager に合わせる
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: 依存を入れる
        run: pnpm install --frozen-lockfile
      - name: 型チェック
        run: pnpm typecheck
      # iOS が読む openapi.json を、コードから生成し直したものと突き合わせる
      - name: openapi.json が最新か
        run: pnpm openapi:check
      # 実際にはデプロイせず、バンドルできるかだけを確かめる（secret は要らない）
      - name: ビルド
        run: pnpm exec wrangler deploy --dry-run --outdir dist
