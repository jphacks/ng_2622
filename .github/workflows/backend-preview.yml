# PR ごとに backend/ のプレビュー（wrangler preview）を作り、URL を PR にコメントする。PR を閉じたら消す。
# プレビューは本番の Worker と別に、Durable Objects の保存領域も PR ごとに分かれる。
# repo の Actions secret に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が要る。
name: backend-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "backend/**"
      - ".github/workflows/backend-preview.yml"

permissions:
  contents: read
  pull-requests: write

# 同じ PR の作成と削除が前後しないよう、PR ごとに 1 本ずつ流す
concurrency:
  group: backend-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  preview:
    # fork からの PR には secret を渡さない
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # pnpm の版は backend/package.json の packageManager に合わせる
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: 依存を入れる
        run: pnpm install --frozen-lockfile
      - name: プレビューを作る
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # --json の出力にはデプロイした人のメールアドレスが入るので、公開ログには URL だけを出す
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json)"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview: $preview_url" >> "$GITHUB_STEP_SUMMARY"
      - name: PR に URL をコメントする
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "backend のプレビュー: $PREVIEW_URL （${SHA:0:7} 時点。PR を閉じると消える）"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: 依存を入れる
        run: pnpm install --frozen-lockfile
      - name: プレビューを消す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation
