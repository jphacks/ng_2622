# git hook の定義。各自 `brew install lefthook && lefthook install` で有効にする。
# 同じ検査を GitHub Actions（.github/workflows/pr-checks.yml）でも行うので、ここは手元で早く気づくためのもの。
commit-msg:
  commands:
    check-commit-message:
      # 件名が Conventional Commits 形式か（type 一覧は scripts/check-commit-msg.sh で定義）
      run: bash scripts/check-commit-msg.sh {1}

pre-commit:
  commands:
    format-biome:
      # TypeScript・JSON などを Biome で整形・lint し、直した分を stage し直す（Markdown は biome.json で対象外）
      # pnpm exec は node_modules の Biome だけを使い、別の版を取ってこない（先に `pnpm install`）
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  commands:
    check-branch-name:
      # push 先のブランチ名が <type>/<slug> 形式か
      run: bash scripts/check-branch-name.sh
      # git が pre-push に渡す ref 一覧を検査スクリプトへ転送する
      use_stdin: true
