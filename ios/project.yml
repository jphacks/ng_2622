# xcodegen の設定。`cd ios && xcodegen` で NG2622.xcodeproj を作る（.xcodeproj は commit しない）
name: NG2622
options:
  bundleIdPrefix: jp.jphacks.ng2622
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # 仮のデータで動かす Mock を既定にする
  defaultConfig: Debug-Mock
configs:
  Debug-Mock: debug
  Release-Mock: release
  Debug-Live: debug
  Release-Live: release
  # App Store に出すビルド（Config/Store.xcconfig）。Local.xcconfig を読まない
  Release-Store: release
configFiles:
  Debug-Mock: Config/Mock.xcconfig
  Release-Mock: Config/Mock.xcconfig
  Debug-Live: Config/Live.xcconfig
  Release-Live: Config/Live.xcconfig
  Release-Store: Config/Store.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
# バックエンドの API の型（backend/openapi.json からビルドのときに作る。Packages/BackendAPI）
packages:
  BackendAPI:
    path: Packages/BackendAPI
targets:
  NG2622:
    type: application
    platform: iOS
    sources:
      - path: NG2622
    settings:
      base:
        PRODUCT_NAME: NG2622
        # iPhone だけで配る。xcodegen は target に iPad も入れる（"1,2"）ので、上の base の値ではなく target に書く
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 署名のチーム ID と bundle ID は Config/Local.xcconfig（各自で作る）から入る
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ScenEnglish
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 部屋の QR を読み取るためにカメラを使います
        # 録音のときに出す、マイクを使う理由
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 英語で話した声を録音して採点するために使います。
        # iPhone は縦向きだけ。iPad 向けの値は、全向きを入れないと警告が出るので入れておく（iPad では配らない）
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # 通信は HTTPS（OS の暗号）だけなので、App Store Connect の輸出規制の質問を毎回聞かれないようにする
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ストアに出すたびに上げる。MARKETING_VERSION は見せる版、CURRENT_PROJECT_VERSION は同じ版の中で毎回上げるビルド番号
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "6"
      configs:
        # 実機から Mac の IP の手元のバックエンドにつなぐときの、ローカルネットワークの許可の説明。開発のときだけ入れる
        # （ストアのビルドに「開発用」の説明を残さない）
        Debug-Mock:
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: 開発用に、同じ Wi-Fi の Mac で動かしているバックエンドにつなぐために使います。
        Debug-Live:
          INFOPLIST_KEY_NSLocalNetworkUsageDescription: 開発用に、同じ Wi-Fi の Mac で動かしているバックエンドにつなぐために使います。
    # 場面を組み立てる部品は、アプリが読む index.json と <id>/<version>.usdz だけを assets/parts から写す（ios/ には写さない）。
    # フォルダごと入れると README.md・contact_sheet.png・メタデータの <version>.json・手元の build/ まで入ってしまう。
    # どの部品も 1.usdz なので、平らに並べると名前がぶつかる。アプリの中では parts/<id>/<version>.usdz になる
    postCompileScripts:
      - name: Copy scene parts
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete --prune-empty-dirs --exclude='build/' --include='*/' --include='/index.json' \
            --include='/*/[0-9]*.usdz' --exclude='*' \
            "$SRCROOT/../assets/parts/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/parts/"
      # Mock で出す、AI で作り置いた場面（配置の JSON）と、その一覧の index.json を backend/src/scenes/pool から写す（ios/ には写さない）。
      # 置き場所はバックエンドと 1 か所にする。README.md は入れない。アプリの中では pool/<sceneId>.json と pool/index.json になる
      - name: Copy scene pool
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete --include='/*.json' --exclude='*' \
            "$SRCROOT/../backend/src/scenes/pool/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/pool/"
      # ホームの広告の見本の 3D（assets/title の USDZ）を写す。README.md と確かめの画像は入れない。
      # 出すかはビルド設定 TITLE_DIORAMA で決め、ファイルは設定にかかわらず入れる。アプリの中では title/<name>.usdz になる
      - name: Copy title dioramas
        basedOnDependencyAnalysis: false
        script: |
          rsync -a --delete --include='/*.usdz' --exclude='*' \
            "$SRCROOT/../assets/title/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/title/"
    dependencies:
      - package: BackendAPI
  # アプリの中の、通信や画面に依らない変換（部屋のメッセージ → 画面のできごとなど）を確かめる
  NG2622Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NG2622Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).tests"
    # BackendAPI はアプリに静的に入っている（test から直接つなぐと動的なフレームワークになり、リンクできない）
    dependencies:
      - target: NG2622
  # App Store のスクリーンショットを撮る UI テスト（SCREENSHOT_DIR があるときだけ撮る。docs/app-store/README.md）
  NG2622UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NG2622UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(inherited).uitests"
        # XCTestCase は MainActor ではないので、アプリの既定（MainActor）を外す
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    dependencies:
      - target: NG2622
schemes:
  NG2622 Mock:
    build:
      targets:
        NG2622: all
    run:
      config: Debug-Mock
    test:
      config: Debug-Mock
      targets:
        - NG2622Tests
        - NG2622UITests
    profile:
      config: Release-Mock
    analyze:
      config: Debug-Mock
    archive:
      config: Release-Mock
  NG2622 Live:
    build:
      targets:
        NG2622: all
    run:
      config: Debug-Live
    test:
      config: Debug-Live
      targets:
        - NG2622Tests
    profile:
      config: Release-Live
    analyze:
      config: Debug-Live
    archive:
      config: Release-Live
  # App Store に出すビルド。Product > Archive で Release-Store を作り、Organizer から App Store Connect に上げる
  NG2622 Store:
    build:
      targets:
        NG2622: all
    run:
      config: Release-Store
    profile:
      config: Release-Store
    analyze:
      config: Release-Store
    archive:
      config: Release-Store
